name: Update contribution calendar

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-contributions.js
      - .github/workflows/update-contributions.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate calendar
        run: node scripts/update-contributions.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-calendar.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution calendar'
            git push
          fi
